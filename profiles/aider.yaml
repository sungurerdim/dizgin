name: aider
version: 1
updated: "2026-04-04"
description: "AI pair programming in your terminal"
binary: aider
runtime: python
config_dirs:
  - "~/.aider.conf.yml"
  - "~/.aider.models.yml"
  - "~/.aider.model.settings.yml"
  - "~/.aider.model.metadata.json"
  - "~/.aider"
  - "~/.aider_history"
  - "~/.cache/aider"
  - "~/Library/Caches/aider"
  - "%APPDATA%/aider"
env_keys:
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - AZURE_OPENAI_API_KEY
  - GEMINI_API_KEY
  - GROQ_API_KEY
  - OPENROUTER_API_KEY
  - AIDER_MODEL
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
network:
  hosts:
    - api.openai.com
    - api.anthropic.com
    - generativelanguage.googleapis.com
    - openrouter.ai

# dizgin provides the sandbox — auto-accept all suggestions + enable prompt caching
default_args:
  - "--yes-always"
  - "--cache-prompts"
  - "--stream"

passthrough:
  - PYTHON_HOME
  - VIRTUAL_ENV
  - PYTHONPATH

mcp_dirs:
  - "~/.mcp"

# Defaults applied automatically (see internal/config/defaults.go):
#   tool_deps (R/W): %ProgramFiles%/Git, ~/.cache
#   mcp_dirs (R/W): ~/.mcp
#   lib_deps (R/O, runtime=python): %LOCALAPPDATA%/Programs/Python, %PYTHON_HOME%
#   env: DO_NOT_TRACK=1, CHOKIDAR_USEPOLLING=1, WATCHPACK_POLLING=true

# DO_NOT_TRACK is applied by default
env:
  AIDER_ANALYTICS: "0"
