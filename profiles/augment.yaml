name: augment
version: 1
updated: "2026-04-04"
description: "Enterprise AI coding assistant (Augment Code)"
binary: augment
runtime: nodejs
config_dirs:
  - "~/.augment"
  - "%APPDATA%/Augment Code"
  - "~/Library/Application Support/Augment Code"
  - "~/.config/augment"

env_keys:
  - AUGMENT_API_KEY
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
network:
  hosts:
    - api.augmentcode.com
    - api.anthropic.com
    - api.openai.com
    - registry.npmjs.org                       # npx-based MCP server installation

passthrough:
  - NODE_HOME

# Defaults applied automatically (see internal/config/defaults.go):
#   tool_deps (R/W): %ProgramFiles%/Git, ~/.cache
#   mcp_dirs (R/W): ~/.mcp
#   lib_deps (R/O, runtime=nodejs): %ProgramFiles%/nodejs, %NODE_HOME%, %APPDATA%/npm
#   env: DO_NOT_TRACK=1, CHOKIDAR_USEPOLLING=1, WATCHPACK_POLLING=true
