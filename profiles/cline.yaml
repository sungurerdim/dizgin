name: cline
version: 1
updated: "2026-04-04"
description: "Autonomous AI coding agent (VS Code extension, formerly Claude Dev)"
binary: cline
runtime: nodejs
config_dirs:
  - "~/.cline"
  - "%APPDATA%/Cline"
  - "~/Library/Application Support/Cline"
  - "~/.config/Cline"

env_keys:
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - CLINE_API_KEY
  - OPENROUTER_API_KEY
network:
  hosts:
    - api.anthropic.com
    - api.openai.com
    - openrouter.ai
    - registry.npmjs.org                       # npx-based MCP server installation
    - marketplace.visualstudio.com             # VS Code extension marketplace

passthrough:
  - NODE_HOME

# dizgin provides the sandbox — auto-approve all operations
default_args:
  - "--auto-approve-all"

# Defaults applied automatically (see internal/config/defaults.go):
#   tool_deps (R/W): %ProgramFiles%/Git, ~/.cache
#   mcp_dirs (R/W): ~/.mcp
#   lib_deps (R/O, runtime=nodejs): %ProgramFiles%/nodejs, %NODE_HOME%, %APPDATA%/npm
#   env: DO_NOT_TRACK=1, CHOKIDAR_USEPOLLING=1, WATCHPACK_POLLING=true
