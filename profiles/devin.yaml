name: devin
version: 1
updated: "2026-04-04"
description: "Autonomous AI software engineer (Cognition)"
binary: devin
runtime: nodejs
config_dirs:
  - "~/.devin"
  - "~/.config/devin"
env_keys:
  - DEVIN_API_KEY
  - COGNITION_API_KEY
network:
  hosts:
    - api.devin.ai
    - registry.npmjs.org

passthrough:
  - NODE_HOME

# dizgin provides the sandbox — bypass tool's own permission checks
default_args:
  - "--permission-mode"
  - "bypass"

# Defaults applied automatically (see internal/config/defaults.go):
#   tool_deps (R/W): %ProgramFiles%/Git, ~/.cache
#   mcp_dirs (R/W): ~/.mcp
#   lib_deps (R/O, runtime=nodejs): %ProgramFiles%/nodejs, %NODE_HOME%, %APPDATA%/npm
#   env: DO_NOT_TRACK=1, CHOKIDAR_USEPOLLING=1, WATCHPACK_POLLING=true
