name: void
version: 1
updated: "2026-04-04"
description: "Open-source AI code editor"
binary: void
runtime: electron
config_dirs:
  - "~/.config/Void"
  - "~/.config/void"
  - "%APPDATA%/Void"
  - "~/Library/Application Support/Void"
env_keys:
  - OPENAI_API_KEY
  - ANTHROPIC_API_KEY
network:
  hosts:
    - api.openai.com
    - api.anthropic.com
    - registry.npmjs.org
    - open-vsx.org

# Defaults applied automatically (see internal/config/defaults.go):
#   tool_deps (R/W): %ProgramFiles%/Git, ~/.cache
#   mcp_dirs (R/W): ~/.mcp
#   lib_deps (R/O, runtime=electron): %ProgramFiles%/nodejs, %NODE_HOME%, %APPDATA%/npm
#   env: DO_NOT_TRACK=1, CHOKIDAR_USEPOLLING=1, WATCHPACK_POLLING=true
