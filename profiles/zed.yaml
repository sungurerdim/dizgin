name: zed
version: 1
updated: "2026-04-04"
description: "Fast, collaborative, AI-native code editor"
binary: zed
runtime: rust
config_dirs:
  - "~/.config/zed"
  - "~/Library/Application Support/Zed"
  - "%APPDATA%/Zed"

mcp_dirs:                                      # R/W: Zed-specific MCP extension configs
  - "~/.config/zed/mcp"

env_keys:
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - ZED_CLIENT_SIDE_AI_API_KEY
network:
  hosts:
    - zed.dev
    - api.zed.dev
    - extensions.zed.dev
    - api.anthropic.com
    - api.openai.com

# Defaults applied automatically (see internal/config/defaults.go):
#   tool_deps (R/W): %ProgramFiles%/Git, ~/.cache
#   mcp_dirs (R/W): ~/.mcp (+ ~/.config/zed/mcp above)
#   env: DO_NOT_TRACK=1, CHOKIDAR_USEPOLLING=1, WATCHPACK_POLLING=true
