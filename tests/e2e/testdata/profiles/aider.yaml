name: aider
version: 3
updated: "2026-03-27"
description: "AI pair programming in your terminal"
binary: aider
runtime: python
ipc: stdio
config_dirs:
  - "~/.aider.conf.yml"
  - "~/.aider.models.yml"
  - "~/.aider.model.settings.yml"
  - "~/.aider.model.metadata.json"
  - "~/.aider"
  - "~/.aider_history"
  - "~/.cache/aider"
  - "~/Library/Caches/aider"
  - "%APPDATA%/aider"
env_keys:
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - AZURE_OPENAI_API_KEY
  - GEMINI_API_KEY
  - GROQ_API_KEY
  - OPENROUTER_API_KEY
  - AIDER_MODEL
  - GIT_AUTHOR_NAME
  - GIT_AUTHOR_EMAIL
network:
  hosts:
    - api.openai.com
    - api.anthropic.com
    - generativelanguage.googleapis.com
    - openrouter.ai

# dizgin provides the sandbox — auto-accept all suggestions + enable prompt caching
default_args:
  - "--yes-always"
  - "--cache-prompts"
  - "--stream"

# Telemetry off
env:
  AIDER_ANALYTICS: "0"
  DO_NOT_TRACK: "1"
