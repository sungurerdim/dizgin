name: gpt-pilot
version: 2
updated: "2026-03-26"
description: "AI developer that builds web apps from scratch"
binary: gpt-pilot
runtime: python
ipc: stdio
config_dirs:
  - "~/.gpt-pilot"
env_keys:
  - OPENAI_API_KEY
network:
  hosts:
    - api.openai.com

# No documented auto-approve or telemetry flags
env:
  DO_NOT_TRACK: "1"
