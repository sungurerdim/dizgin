name: tabnine
version: 2
updated: "2026-03-26"
description: "AI code completion engine"
binary: tabnine
runtime: nodejs
ipc: socket
config_dirs:
  - "~/.tabnine"
env_keys:
  - TABNINE_API_KEY
network:
  hosts:
    - api.tabnine.com

# No documented CLI auto-approve or telemetry env vars
env:
  DO_NOT_TRACK: "1"
